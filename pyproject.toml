[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-merger"
version = "0.1.0"
description = "A desktop application for merging PDF files"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.16,<7",
    "PySide6>=6.11,<7",
]

[project.scripts]
pdf-merger = "gui.main:main"

[tool.setuptools]
packages = ["gui", "pdf_merger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install dependencies and project
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag version $tag_version does not match project version $project_version."
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build packaged application
        run: python -m PyInstaller --clean --noconfirm pdf_merger.spec

      - name: Smoke test packaged GUI
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set +e
          timeout 3s ./dist/pdf-merger
          status=$?
          set -e

          if [ "$status" -ne 124 ]; then
            echo "Expected packaged GUI to remain running until timeout; got status $status."
            exit 1
          fi

      - name: Prepare versioned release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="pdf-merger-linux-x86_64-${version}"

          cp dist/pdf-merger "dist/$asset"
          chmod +x "dist/$asset"

          (
            cd dist
            sha256sum "$asset" > "$asset.sha256"
          )

          echo "RELEASE_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease_flag=""

          if [[ "$version" == *"rc"* || "$version" == *"a"* || "$version" == *"b"* ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/$RELEASE_ASSET" \
              "dist/$RELEASE_ASSET.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/$RELEASE_ASSET" \
              "dist/$RELEASE_ASSET.sha256" \
              --title "PDF Merger $GITHUB_REF_NAME" \
              --generate-notes \
              $prerelease_flag
          fi

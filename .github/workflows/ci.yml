name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Smoke test CLI
        run: python main.py --help

      - name: Build packaged application
        run: python -m PyInstaller --clean --noconfirm pdf_merger.spec

      - name: Smoke test packaged GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 3s ./dist/pdf-merger
          status=$?
          set -e

          if [ "$status" -ne 124 ]; then
            echo "Expected packaged GUI to remain running until timeout; got status $status."
            exit 1
          fi
